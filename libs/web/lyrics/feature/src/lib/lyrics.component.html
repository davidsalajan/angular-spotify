@if (status$ | async; as status) {
  @if (status === 'loading' || status === 'idle') {
    <div class="lyrics-loading">
      <as-spinner></as-spinner>
    </div>
  } @else if (status === 'error') {
    <div class="lyrics-loading">
      <p class="text-2xl text-gray-400">No lyrics available for this track.</p>
    </div>
  } @else {
    <div class="lyrics-loaded">
      <as-lyrics-view
        [lyrics]="lyrics$ | async"
        [activeLine]="(activeLine$ | async) ?? -1"
        [isSynced]="(isSynced$ | async) ?? false"
        [annotationByIndex]="(annotationByIndex$ | async) ?? {}"
        [annotationEnabled]="(enabled$ | async) ?? false"
        (seekTo)="onSeekTo($event)"
        (visibleRangeChange)="onVisibleRangeChange($event)"
      ></as-lyrics-view>
      @if (pageStatusText$ | async; as statusText) {
        <div class="annotation-status" role="status" aria-live="polite">
          <span class="annotation-status__dot"></span>
          <span>{{ statusText }}</span>
        </div>
      }
    </div>
  }
}
